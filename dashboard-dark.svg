  <text x="280" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Y5</text>
  <text x="380" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Y7</text>
  <text x="480" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Y10</text>

