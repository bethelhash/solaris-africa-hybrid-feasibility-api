<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" fill="none">
  <defs>
    <linearGradient id="dLbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="880" height="420" rx="16" fill="url(#dLbg)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="880" height="48" rx="16" fill="#FFFFFF"/>
  <rect x="0" y="32" width="880" height="16" fill="#FFFFFF"/>
  <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Solaris · Underwriting Dashboard</text>
  <rect x="700" y="14" width="72" height="22" rx="11" fill="#ECFDF5"/>
  <text x="736" y="29" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#059669">BANKABLE</text>
  <rect x="780" y="14" width="72" height="22" rx="11" fill="#EFF6FF"/>
  <text x="816" y="29" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">1.30× PASS</text>

  <!-- KPI cards -->
  <g transform="translate(24, 64)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="195" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="16" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Project IRR</text>
    <text x="16" y="56" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">46.3%</text>
    <!-- Card 2 -->
    <rect x="211" y="0" width="195" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="227" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Min DSCR</text>
    <text x="227" y="56" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">2.96×</text>
    <!-- Card 3 -->
    <rect x="422" y="0" width="195" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="438" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Total CAPEX</text>
    <text x="438" y="56" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">$1.56M</text>
    <!-- Card 4 -->
    <rect x="633" y="0" width="195" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="649" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">CO₂ Avoided / yr</text>
    <text x="649" y="56" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">1,240 t</text>
  </g>

  <!-- DSCR chart panel -->
  <rect x="24" y="160" width="520" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="186" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">DSCR Covenant Trajectory</text>
  <text x="40" y="204" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">South Africa · Manufacturing · 1,000 kVA</text>

  <!-- Chart axes -->
  <line x1="60" y1="360" x2="520" y2="360" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="60" y1="230" x2="60" y2="360" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Threshold lines -->
  <line x1="60" y1="320" x2="520" y2="320" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="525" y="324" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#DC2626">1.05×</text>
  <line x1="60" y1="300" x2="520" y2="300" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="525" y="304" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#F59E0B">1.20×</text>
  <line x1="60" y1="280" x2="520" y2="280" stroke="#16A34A" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="525" y="284" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#16A34A">1.30×</text>

  <!-- DSCR curve (stylized Year1 high then settle) -->
  <path d="M80 245 L130 270 L180 275 L230 278 L280 280 L330 282 L380 283 L430 284 L480 285"
        fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M80 245 L130 270 L180 275 L230 278 L280 280 L330 282 L380 283 L430 284 L480 285 L480 360 L80 360 Z"
        fill="url(#chartFill)"/>
  <!-- Year labels -->
  <text x="80" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Y1</text>
  <text x="180" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Y3</text>
  <text x="280" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Y5</text>
  <text x="380" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Y7</text>
  <text x="480" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Y10</text>

  <!-- Side panel: dispatch -->
  <rect x="560" y="160" width="296" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="576" y="186" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Merit-Order Dispatch</text>

  <g transform="translate(576, 210)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#F59E0B"/>
    <text x="22" y="11" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Solar direct</text>
    <rect x="0" y="28" width="12" height="12" rx="2" fill="#3B82F6"/>
    <text x="22" y="39" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">BESS discharge</text>
    <rect x="0" y="56" width="12" height="12" rx="2" fill="#94A3B8"/>
    <text x="22" y="67" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Grid (if available)</text>
    <rect x="0" y="84" width="12" height="12" rx="2" fill="#EF4444"/>
    <text x="22" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Diesel (≥30% floor)</text>
  </g>

  <text x="576" y="340" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">ISO 8528-1 wet-stacking protection</text>
  <text x="576" y="358" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Tax: SA §12B applied · Free Zone: not assumed</text>
</svg>
