<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Soft background glow -->
  <circle cx="120" cy="100" r="70" fill="#FEF3C7" opacity="0.5"/>

  <!-- Sun -->
  <circle cx="120" cy="72" r="28" fill="url(#sunGrad)"/>
  <!-- Sun rays -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="30" x2="120" y2="20"/>
    <line x1="120" y1="124" x2="120" y2="134"/>
    <line x1="78" y1="72" x2="68" y2="72"/>
    <line x1="162" y1="72" x2="172" y2="72"/>
    <line x1="90" y1="42" x2="83" y2="35"/>
    <line x1="150" y1="42" x2="157" y2="35"/>
    <line x1="90" y1="102" x2="83" y2="109"/>
    <line x1="150" y1="102" x2="157" y2="109"/>
  </g>

  <!-- Solar panel array -->
  <g transform="translate(70, 108)">
    <rect x="0" y="0" width="100" height="48" rx="3" fill="url(#panelGrad)"/>
    <!-- Grid lines -->
    <line x1="25" y1="0" x2="25" y2="48" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="50" y1="0" x2="50" y2="48" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="75" y1="0" x2="75" y2="48" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="16" x2="100" y2="16" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="32" x2="100" y2="32" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <!-- Highlight -->
    <rect x="4" y="4" width="18" height="10" rx="1" fill="#60A5FA" opacity="0.25"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="95" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="url(#textGrad)" letter-spacing="-1.5">Solaris</text>
  <text x="222" y="128" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748B" letter-spacing="0.5">DETERMINISTIC RENEWABLE ENERGY UNDERWRITING</text>
  <text x="222" y="150" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">Africa · C&amp;I Solar+BESS · Lender-Grade</text>
</svg>
