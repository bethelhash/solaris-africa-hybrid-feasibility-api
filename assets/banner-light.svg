  <rect x="42" y="90" width="56" height="28" rx="2" fill="#0F172A"/>
  <line x1="56" y1="90" x2="56" y2="118" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
  <line x1="70" y1="90" x2="70" y2="118" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
  <line x1="84" y1="90" x2="84" y2="118" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
