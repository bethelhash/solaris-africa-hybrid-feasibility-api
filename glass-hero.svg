<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none">
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="16" fill="url(#glassBg)"/>

  <!-- Ambient orbs -->
  <circle cx="120" cy="60" r="80" fill="#F59E0B" opacity="0.12" filter="url(#blur)"/>
  <circle cx="680" cy="160" r="90" fill="#3B82F6" opacity="0.12" filter="url(#blur)"/>
  <circle cx="400" cy="40" r="50" fill="#10B981" opacity="0.08" filter="url(#blur)"/>

  <!-- Glass card -->
  <rect x="40" y="36" width="720" height="148" rx="14" fill="url(#cardGlass)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="40" y="36" width="5" height="148" rx="2" fill="url(#accent)"/>

  <!-- Icon: abstract underwriting mark -->
  <g transform="translate(70, 70)">
    <rect x="0" y="20" width="56" height="40" rx="4" fill="#1E40AF" opacity="0.9"/>
    <rect x="6" y="26" width="12" height="8" rx="1" fill="#60A5FA" opacity="0.6"/>
    <rect x="22" y="26" width="12" height="8" rx="1" fill="#60A5FA" opacity="0.4"/>
    <rect x="38" y="26" width="12" height="8" rx="1" fill="#60A5FA" opacity="0.3"/>
    <rect x="6" y="38" width="12" height="8" rx="1" fill="#60A5FA" opacity="0.5"/>
    <rect x="22" y="38" width="12" height="8" rx="1" fill="#60A5FA" opacity="0.35"/>
    <rect x="38" y="38" width="12" height="8" rx="1" fill="#60A5FA" opacity="0.25"/>
    <circle cx="28" cy="8" r="12" fill="#F59E0B"/>
    <circle cx="28" cy="8" r="6" fill="#FEF3C7"/>
  </g>

  <!-- Text -->
  <text x="150" y="95" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Build a lender-grade IC report in one API call</text>
  <text x="150" y="128" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">Solar resource → Dispatch → Debt sizing → DSCR → Tax → Scenarios → Report JSON</text>
  <text x="150" y="152" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Conservative-by-default · Single source of truth · IFC 1.30× covenant</text>
</svg>
